name: Release

# A tag vX.Y.Z builds the Debian/Ubuntu packages, the tarball and the
# Windows installer, tries them and publishes the GitHub Release. Run by
# hand (workflow_dispatch) it does everything but publishing.
on:
  push:
    tags: ["v*"]
  # pull requests that touch the packaging try the packages too
  pull_request:
    paths: ["debian/**", "packaging/**", "requirements-*.txt", "docs/manual/**", "scripts/build-manual.sh",
            ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:trixie", suffix: deb13 }
          - { image: "debian:forky", suffix: deb14 }
          - { image: "ubuntu:24.04", suffix: ubuntu24.04 }
          - { image: "ubuntu:26.04", suffix: ubuntu26.04 }
    steps:
      - name: Build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git \
            build-essential debhelper dpkg-dev devscripts equivs desktop-file-utils appstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_desktop/__init__.py)
          # a release is built on a released library
          case "$GITHUB_REF" in refs/tags/v*) test "v$V" = "${GITHUB_REF#refs/tags/}"; grep -q "^v" .github/lib-ref ;; esac
          # Debian: a beta 1.1.0-beta.1 is 1.1.0~beta.1 (sorts before 1.1.0)
          DV=$(echo "$V" | tr '-' '~')
          # the package: that version and a Debian revision, 1.1.0~beta.1-1
          PV=$(dpkg-parsechangelog -S Version)
          test "$(dpkg-parsechangelog -S Source)" = activitytrack-desktop && test "${PV%-*}" = "$DV" && test "$PV" != "$DV"
          grep -q "<release version=\"$DV\"" packaging/it.infraconsulting.activitytrack_desktop.metainfo.xml
          # the distribution goes in the revision: 1.1.0~beta.1-1~deb13 still satisfies (>= 1.1.0~beta.1)
          sed -i "1s/($PV)/($PV~${{ matrix.suffix }})/" debian/changelog
          head -1 debian/changelog
      - name: Desktop entry and AppStream
        run: |
          desktop-file-validate packaging/activitytrack-desktop.desktop
          appstreamcli validate --no-net --pedantic packaging/it.infraconsulting.activitytrack_desktop.metainfo.xml || \
            appstreamcli validate --no-net packaging/it.infraconsulting.activitytrack_desktop.metainfo.xml
      - name: The library's package (python3-activitytrack at .github/lib-ref)
        run: |
          git clone --depth 1 -b "$(cat .github/lib-ref)" https://github.com/zipclaude/python3-activitytrack /tmp/lib
          cd /tmp/lib
          # versioned as in its release (1.1.0~beta.1-1~deb13): the Depends are tried on that
          sed -i "1s/(\([^)]*\))/(\1~${{ matrix.suffix }})/" debian/changelog
          DEBIAN_FRONTEND=noninteractive mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -b -us -uc
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/python3-activitytrack_*.deb
      - name: Package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist && mv ../activitytrack-desktop_*.deb dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Install
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
      - name: Try it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          activitytrack-desktop --version
          # the tests against the installed code, not the checkout's
          mkdir /tmp/t && cp -r tests /tmp/t/ && cd /tmp/t
          PYTHONPATH=/usr/share/activitytrack-desktop python3 -c "import activitytrack_desktop, sys; print(activitytrack_desktop.__file__)"
          PYTHONPATH=/usr/share/activitytrack-desktop python3 -m unittest discover -s tests -t . -v
      - name: Remove
        run: |
          apt-get purge -y activitytrack-desktop
          test ! -e /usr/share/activitytrack-desktop && test ! -e /usr/bin/activitytrack-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.suffix }}
          path: dist/*.deb

  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tarball
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_desktop/__init__.py)
          mkdir dist
          git archive --prefix="activitytrack-desktop-$V/" -o "dist/activitytrack-desktop-$V.tar.gz" HEAD
          tar -tzf dist/*.tar.gz | grep -c .
          mkdir /tmp/at && tar -xzf dist/*.tar.gz -C /tmp/at --strip-components=1
          test -f /tmp/at/activitytrack_desktop/__main__.py
          test -f /tmp/at/packaging/activitytrack-desktop.desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: dist/*.tar.gz

  windows:
    # docs/DESIGN.md §8: PyInstaller (one folder) and Inno Setup, per user, not signed (D10)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Libraries and tools
        run: |
          python -m pip install -r requirements-windows.txt -r requirements-build-windows.txt
          python -m pip install "git+https://github.com/zipclaude/python3-activitytrack@$(Get-Content .github/lib-ref)"
      - name: Version
        run: |
          $V = (Select-String -Path activitytrack_desktop/__init__.py -Pattern '^__version__ = "(.*)"').Matches[0].Groups[1].Value
          if ("$env:GITHUB_REF" -like "refs/tags/v*" -and "v$V" -ne "$env:GITHUB_REF_NAME") { throw "tag $env:GITHUB_REF_NAME, version $V" }
          "AT_VERSION=$V" >> $env:GITHUB_ENV
          "AT_NUMVERSION=$(($V -split '-')[0])" >> $env:GITHUB_ENV
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .
      - name: Bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --name ActivityTrack `
            --icon packaging/windows/activitytrack-desktop.ico `
            --paths . --collect-submodules keyring.backends --collect-data tzdata `
            --collect-submodules activitytrack --collect-data activitytrack --collect-data activitytrack_desktop `
            packaging/windows/launcher.py
      - name: Try the bundle
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/ActivityTrack/ActivityTrack.exe -ArgumentList "--selftest", "$pwd/selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest: $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.txt -Pattern "^ok $env:AT_VERSION ")) { throw "selftest output" }
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/windows/activitytrack-desktop.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc $LASTEXITCODE" }
          Get-ChildItem dist/*.exe
      - name: Install, try, uninstall
        run: |
          $setup = (Get-ChildItem dist/ActivityTrackDesktop-*-setup.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=autostart" -Wait
          $app = "$env:LOCALAPPDATA\Programs\ActivityTrack"
          if (-not (Test-Path "$app\ActivityTrack.exe")) { throw "not installed in $app" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name ActivityTrack
          if ($run.ActivityTrack -notlike "*--hidden") { throw "autostart: $($run.ActivityTrack)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process "$app\ActivityTrack.exe" -ArgumentList "--selftest", "$pwd/installed.txt" -Wait -PassThru
          Get-Content installed.txt
          if ($p.ExitCode -ne 0) { throw "installed selftest: $($p.ExitCode)" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\ActivityTrack.exe") { throw "still installed" }
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name ActivityTrack -ErrorAction SilentlyContinue) { throw "autostart left" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/ActivityTrackDesktop-*-setup.exe

  # the user manual, it and en (docs/manual)
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Manual
        run: |
          # a release's manual carries its version
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_desktop/__init__.py)
          case "$GITHUB_REF" in refs/tags/v*)
            for f in docs/manual/it/desktop.md docs/manual/en/desktop.md; do
              head -1 "$f" | grep -q "^Versione $V \|^Version $V " || { echo "$f does not say version $V"; exit 1; }
            done ;;
          esac
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
          scripts/build-manual.sh
          mkdir dist && cp build/manual/*.pdf dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual
          path: dist/*.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, tarball, windows, manual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          R=$(dpkg-parsechangelog -S Version) && R="${R##*-}"   # the Debian revision
          # GitHub turns the "~" of the package versions into "." in asset names: "-" instead
          cd artifacts
          for f in activitytrack-desktop_*~*_all.deb; do mv "$f" "$(echo "$f" | tr '~' '-')"; done
          sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          {
            case "$V" in
              *-*) echo "ActivityTrack Desktop $V: a test release, not for daily use yet."
                   echo
                   echo "A server older than ActivityTrack Web 0.9.4 lists the PC among the phones: pair the phone first, or check on the web that the phone keeps \"Invia ai gestionali\"." ;;
              *) echo "ActivityTrack Desktop $V, for ActivityTrack Web $V." ;;
            esac
            echo
            echo "It needs an ActivityTrack Web server to pair with (Dispositivi → Associa un dispositivo, then paste the link)."
            echo
            echo "- Debian 13 / 14, Ubuntu 24.04 / 26.04: \`apt install ./python3-activitytrack_*-<distro>_all.deb ./activitytrack-desktop_${V}-${R}-<distro>_all.deb\` (deb13, deb14, ubuntu24.04, ubuntu26.04); the library [python3-activitytrack](https://github.com/zipclaude/python3-activitytrack/releases/tag/$(cat .github/lib-ref)) is in its own release"
            echo "- Other distributions: \`activitytrack-desktop-$V.tar.gz\`, see [README](https://github.com/${GITHUB_REPOSITORY}/blob/v$V/README.md)"
            echo "- Windows 10 / 11: \`ActivityTrackDesktop-$V-setup.exe\`, installed for the current user. It is not signed: Windows SmartScreen warns at the first run (More info → Run anyway); check the file against SHA256SUMS."
            echo
            echo "Manual: \`ActivityTrack-Desktop-Manuale-$V.pdf\` (it), \`ActivityTrack-Desktop-Manual-$V.pdf\` (en)."
          } > notes.md
          # a tag with a suffix (v1.1.0-beta.1) is a beta: a pre-release
          case "$V" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "v$V" artifacts/* --title "ActivityTrack Desktop $V" --notes-file notes.md $pre
