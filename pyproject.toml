[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activitytrack-desktop"
dynamic = ["version"]
description = "Tray application of ActivityTrack for the PC"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# on Linux from the distribution (python3-pyqt6, python3-cryptography, python3-keyring)
# the library (python3-activitytrack) brings cryptography, keyring and, on Windows, tzdata
dependencies = ["activitytrack>=1.0.0a1", "PyQt6>=6.6"]

[project.scripts]
activitytrack-desktop = "activitytrack_desktop.main:main"

[tool.setuptools]
packages = ["activitytrack_desktop"]

[tool.setuptools.package-data]
activitytrack_desktop = ["locale/*.json"]

[tool.setuptools.dynamic]
version = { attr = "activitytrack_desktop.__pep440__" }
