[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activitytrack-desktop"
dynamic = ["version"]
description = "Tray application of ActivityTrack for the PC"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# on Linux from the distribution (python3-pyqt6, python3-cryptography, python3-keyring)
dependencies = ["PyQt6>=6.6", "cryptography>=38", "keyring>=23", "tzdata; sys_platform == 'win32'"]

[project.scripts]
activitytrack-desktop = "activitytrack_desktop.main:main"

[tool.setuptools]
packages = ["activitytrack_desktop"]

[tool.setuptools.package-data]
activitytrack_desktop = ["locale/*.json"]

[tool.setuptools.dynamic]
version = { attr = "activitytrack_desktop.__version__" }
